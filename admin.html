<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>皇帝 - 内务府后台管理</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
    <style>
        :root {
            --primary: #d4af37;
            --bg: #0f0c29;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Inter', 'Outfit', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding: 20px;
            background: var(--glass);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid var(--glass-border);
        }

        h1 {
            margin: 0;
            color: var(--primary);
            font-size: 1.5rem;
        }

        .btn {
            background: var(--primary);
            color: black;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }

        .btn-danger {
            background: #ff4d4d;
            color: white;
        }

        /* Form Modal */
        #modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 20px;
            width: 400px;
            border: 1px solid var(--primary);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #ccc;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 8px;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--glass);
            -webkit-backdrop-filter: blur(5px);
            backdrop-filter: blur(5px);
            border-radius: 10px;
            overflow: hidden;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid var(--glass-border);
        }

        th {
            background: rgba(255, 255, 255, 0.1);
            color: var(--primary);
        }

        .portrait-preview {
            width: 45px;
            height: 60px;
            /* 3:4 ratio */
            border-radius: 4px;
            object-fit: cover;
            background: #333;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        .btn-nowrap {
            white-space: nowrap;
        }

        .filter-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding: 15px;
            background: var(--glass);
            border-radius: 10px;
            border: 1px solid var(--glass-border);
        }

        .filter-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-item input,
        .filter-item select {
            width: 200px;
        }

        .desc-cell {
            max-width: 300px;
            font-size: 0.85rem;
            color: #ccc;
        }

        .con-textarea {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 5px;
            padding: 8px;
        }

        /* Avatar Picker */
        .avatar-preview-large {
            width: 120px;
            height: 160px;
            /* 3:4 ratio */
            border-radius: 10px;
            border: 2px solid var(--primary);
            margin-bottom: 10px;
            display: block;
            object-fit: cover;
            background: #333;
        }

        #avatar-selector {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1a1a2e;
            padding: 20px;
            border-radius: 15px;
            border: 2px solid var(--primary);
            width: 80%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            z-index: 1100;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
        }

        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .avatar-item {
            cursor: pointer;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid transparent;
            transition: all 0.2s;
            aspect-ratio: 3 / 4;
        }

        .avatar-item:hover {
            border-color: var(--primary);
            transform: scale(1.05);
        }

        .avatar-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Cropper Layer */
        #cropper-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .cropper-container-box {
            width: 80%;
            height: 70%;
            background: #000;
            margin-bottom: 20px;
            border: 1px solid var(--primary);
        }

        #crop-image-target {
            max-width: 100%;
            max-height: 100%;
            display: block;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>📜 历史名妃池管理</h1>
            <button class="btn" onclick="openModal()">+ 新增名妃</button>
        </header>

        <div class="filter-bar">
            <div class="filter-item">
                <label>姓名搜索</label>
                <input type="text" id="search-name" placeholder="输入姓名..." oninput="fetchPool()">
            </div>
            <div class="filter-item">
                <label>朝代筛选</label>
                <select id="filter-dynasty" onchange="fetchPool()">
                    <option value="">全部</option>
                    <option value="商朝">商朝</option>
                    <option value="西周">西周</option>
                    <option value="春秋">春秋</option>
                    <option value="秦末">秦末</option>
                    <option value="西汉">西汉</option>
                    <option value="东汉">东汉</option>
                    <option value="三国">三国</option>
                    <option value="东晋">东晋</option>
                    <option value="南北朝">南北朝</option>
                    <option value="五代">五代</option>
                    <option value="唐朝">唐朝</option>
                    <option value="北宋">北宋</option>
                    <option value="南宋">南宋</option>
                    <option value="宋朝">宋朝</option>
                    <option value="元朝">元朝</option>
                    <option value="明朝">明朝</option>
                    <option value="明清">明清</option>
                    <option value="清朝">清朝</option>
                    <option value="现代">现代</option>
                </select>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>头像</th>
                    <th>姓名</th>
                    <th>朝代</th>
                    <th>魅力</th>
                    <th>性格</th>
                    <th>人物简介/描述</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="pool-list">
                <!-- 动态加载 -->
            </tbody>
        </table>
    </div>

    <!-- Modal Form -->
    <div id="modal">
        <div class="modal-content">
            <h2 id="modal-title">新增名妃</h2>
            <form id="concubine-form">
                <input type="hidden" id="con-id">
                <div class="form-group">
                    <label>姓名</label>
                    <input type="text" id="con-name" required>
                </div>
                <div class="form-group">
                    <label>头像预览</label>
                    <img id="con-avatar-preview" src="" class="avatar-preview-large">
                    <div class="input-group">
                        <input type="text" id="con-avatar" placeholder="资源路径..." oninput="updatePreview(this.value)">
                        <button type="button" class="btn btn-nowrap" onclick="openAvatarSelector()">选择文件</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>初始魅力 (0-100)</label>
                    <input type="number" id="con-beauty" min="0" max="100" value="80">
                </div>
                <div class="form-group">
                    <label>性格描述</label>
                    <input type="text" id="con-personality">
                </div>
                <div class="form-group">
                    <label>归属朝代</label>
                    <input type="text" id="con-dynasty" placeholder="如：汉朝, 唐朝, 现代">
                </div>
                <div class="form-group">
                    <label>人物简介</label>
                    <textarea id="con-description" rows="3" class="con-textarea"></textarea>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="submit" class="btn">保存</button>
                    <button type="button" class="btn btn-danger" onclick="closeModal()">取消</button>
                </div>
            </form>
        </div>
    </div>

    <div id="avatar-selector">
        <div
            style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--glass-border); padding-bottom: 10px;">
            <h3 style="margin: 0; color: var(--primary);">选择宫廷佳丽画像</h3>
            <button class="btn btn-danger" onclick="closeAvatarSelector()">关闭</button>
        </div>
        <div id="avatar-grid" class="avatar-grid">
            <!-- 动态加载 -->
        </div>
    </div>

    <!-- Cropper Modal -->
    <div id="cropper-modal">
        <h2 style="color: var(--primary); margin-bottom: 20px;">手动框选画像范围 (3:4)</h2>
        <div class="cropper-container-box">
            <img id="crop-image-target">
        </div>
        <div style="display: flex; gap: 20px;">
            <button class="btn" onclick="confirmCrop()">确认裁剪并上传</button>
            <button class="btn btn-danger" onclick="closeCropper()">取消</button>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3001/api/admin';
        const form = document.getElementById('concubine-form');
        const modal = document.getElementById('modal');
        let cropper = null;
        let currentEditingFileName = '';

        async function fetchPool() {
            const name = document.getElementById('search-name').value;
            const dynasty = document.getElementById('filter-dynasty').value;

            const params = new URLSearchParams();
            if (name) params.append('name', name);
            if (dynasty) params.append('dynasty', dynasty);

            const res = await fetch(`${API_BASE}/pool?${params.toString()}`);
            const data = await res.json();
            const list = document.getElementById('pool-list');
            list.innerHTML = data.map(c => `
                <tr>
                    <td><img src="${c.avatar_url || 'https://via.placeholder.com/120x160'}" class="portrait-preview"></td>
                    <td>${c.name}</td>
                    <td><span style="color: var(--primary)">${c.dynasty || '未知'}</span></td>
                    <td>${c.beauty}</td>
                    <td>${c.personality || '-'}</td>
                    <td class="desc-cell">${c.description || '-'}</td>
                    <td class="actions">
                        <button class="btn" style="padding: 5px 10px;" onclick="editCon(${JSON.stringify(c).replace(/"/g, '&quot;')})">编辑</button>
                        <button class="btn btn-danger" style="padding: 5px 10px;" onclick="deleteCon(${c.id})">删除</button>
                    </td>
                </tr>
            `).join('');
        }

        form.onsubmit = async (e) => {
            e.preventDefault();
            const data = {
                id: document.getElementById('con-id').value || undefined,
                name: document.getElementById('con-name').value,
                avatar_url: document.getElementById('con-avatar').value,
                beauty: parseInt(document.getElementById('con-beauty').value),
                personality: document.getElementById('con-personality').value,
                description: document.getElementById('con-description').value,
                dynasty: document.getElementById('con-dynasty').value,
            };

            await fetch(`${API_BASE}/pool`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            closeModal();
            fetchPool();
        };

        async function deleteCon(id) {
            if (!confirm('确定要从数据库中永久移除这位佳丽吗？')) return;
            await fetch(`${API_BASE}/pool/${id}`, { method: 'DELETE' });
            fetchPool();
        }

        function openModal() {
            modal.style.display = 'flex';
            form.reset();
            document.getElementById('con-id').value = '';
            document.getElementById('modal-title').innerText = '新增名妃';
            updatePreview('');
        }

        function editCon(c) {
            modal.style.display = 'flex';
            document.getElementById('modal-title').innerText = '编辑名妃';
            document.getElementById('con-id').value = c.id;
            document.getElementById('con-name').value = c.name;
            document.getElementById('con-avatar').value = c.avatar_url;
            updatePreview(c.avatar_url);
            document.getElementById('con-beauty').value = c.beauty;
            document.getElementById('con-personality').value = c.personality;
            document.getElementById('con-description').value = c.description || '';
            document.getElementById('con-dynasty').value = c.dynasty || '';
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        async function openAvatarSelector() {
            const selector = document.getElementById('avatar-selector');
            const grid = document.getElementById('avatar-grid');
            selector.style.display = 'block';

            const res = await fetch('http://localhost:3001/api/admin/avatars');
            const avatars = await res.json();

            grid.innerHTML = avatars.map(url => `
                <div class="avatar-item" onclick="selectAvatar('${url}')">
                    <img src="${url}">
                </div>
            `).join('');
        }

        function closeAvatarSelector() {
            document.getElementById('avatar-selector').style.display = 'none';
        }

        function selectAvatar(url) {
            currentEditingFileName = url.split('/').pop();
            startCropping(url);
            closeAvatarSelector();
        }

        function startCropping(imageUrl) {
            const cropperModal = document.getElementById('cropper-modal');
            const cropImage = document.getElementById('crop-image-target');
            cropImage.src = imageUrl;
            cropperModal.style.display = 'flex';

            if (cropper) {
                cropper.destroy();
            }

            // 初始化裁剪插件 (3:4 比例)
            cropper = new Cropper(cropImage, {
                aspectRatio: 3 / 4,
                viewMode: 1,
                background: false,
                autoCropArea: 1
            });
        }

        function closeCropper() {
            document.getElementById('cropper-modal').style.display = 'none';
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }
        }

        async function confirmCrop() {
            if (!cropper) return;

            const canvas = cropper.getCroppedCanvas({
                width: 600,
                height: 800
            });

            const imageData = canvas.toDataURL('image/png');

            try {
                // 上传裁剪结果到服务器
                const res = await fetch('http://localhost:3001/api/admin/upload-cropped', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        imageData: imageData,
                        fileName: currentEditingFileName
                    })
                });
                const result = await res.json();

                if (result.url) {
                    document.getElementById('con-avatar').value = result.url;
                    updatePreview(result.url);
                    closeCropper();
                } else {
                    alert('上传失败：' + (result.error || '未知错误'));
                }
            } catch (err) {
                alert('连接服务器失败');
            }
        }

        function updatePreview(url) {
            document.getElementById('con-avatar-preview').src = url ? (url.startsWith('http') ? url : url) : 'https://via.placeholder.com/300x400';
        }

        fetchPool();
    </script>
</body>

</html>
