name = "huangdi-emperor-sim"
main = "worker.ts"
compatibility_date = "2024-01-01"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "huangdi-db"
database_id = "YOUR_DATABASE_ID"  # 部署时需要替换

# 环境变量
[vars]
ENVIRONMENT = "production"

# 开发环境配置
[env.dev]
name = "huangdi-emperor-sim-dev"

# 生产环境配置
[env.production]
name = "huangdi-emperor-sim"
routes = [
  { pattern = "api.your-domain.com/*", zone_name = "your-domain.com" }
]

# Workers 配置
[build]
command = "npm run build:worker"

# 兼容性标志
[compatibility_flags]
nodejs_compat = true
